services:
  postgres:
    image: postgres:16-alpine
    container_name: jobtracker-db
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server/JobTracker.API
      dockerfile: Dockerfile
    container_name: jobtracker-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=jobtracker;Username=jobtracker;Password=jobtracker_secret_password"
      Jwt__Key: "SuperSecretProductionKeyMustBeLongEnoughForSecurity1234567890!"
      Jwt__Issuer: "JobTracker.API"
      Jwt__Audience: "JobTracker.Client"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jobtracker-client
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
