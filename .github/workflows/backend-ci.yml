name: Server CI

on:
  push:
    branches:
      - main
      - dev
      - refactor/*
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore JobTracker.slnx

      - name: Security Vulnerability Audit
        run: dotnet list server/JobTracker.API/JobTracker.API.csproj package --vulnerable || true

      - name: Build solution
        run: dotnet build JobTracker.slnx --no-restore

      - name: Run xUnit tests
        run: dotnet test JobTracker.slnx --no-build --verbosity normal